<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos — ZeroOnze</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============ HEADER (variação loja) ============ -->
  <header class="header header--shop">
    <div class="container header__inner">
      <a class="logo" href="index.html"><img src="assets/img/logo.png" alt="ZeroOnze"></a>

      <form class="search" action="produtos.html" method="get" role="search">
        <input type="search" id="search-input" name="busca" placeholder="Buscar produtos" aria-label="Buscar produtos">
        <button type="submit" data-icon="lupa" aria-label="Buscar"></button>
      </form>

      <div class="header__icons">
        <a class="icon-btn account-link" href="entrar.html" data-icon="conta" data-account aria-label="Minha conta" title="Minha conta"><span class="account-hello"></span></a>
        <button class="icon-btn" id="cart-open" data-icon="carrinho" aria-label="Carrinho">
          <span class="cart-count"></span>
        </button>
      </div>
    </div>

    <div class="container">
      <nav class="nav" aria-label="Principal">
        <a href="index.html">Início</a>
        <a href="produtos.html">Produtos</a>
        <div class="dropdown">
          <a href="produtos.html">Categorias</a>
          <div class="dropdown__menu">
            <a href="produtos.html?categoria=dragon-ball">Dragon Ball</a>
            <a href="produtos.html?categoria=one-piece">One Piece</a>
            <a href="produtos.html?categoria=naruto">Naruto</a>
            <a href="produtos.html?categoria=jujutsu-kaisen">Jujutsu Kaisen</a>
            <a href="produtos.html?categoria=attack-on-titan">Attack on Titan</a>
          </div>
        </div>
        <a href="pedidos.html">Meus pedidos</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- ============ BARRA DE RESULTADOS ============ -->
    <div class="shop-bar">
      <div class="shop-bar__info">
        <h1 class="shop-bar__title display" id="shop-title">Todos os produtos</h1>
        <span class="shop-bar__count" id="shop-count"></span>
      </div>

      <div class="shop-bar__controls">
        <div class="sort">
          <label for="sort"><b>Ordenar por</b>:</label>
          <select id="sort">
            <option value="relevantes">mais relevantes</option>
            <option value="menor">menor preço</option>
            <option value="maior">maior preço</option>
            <option value="az">nome (A–Z)</option>
          </select>
        </div>
        <button class="filter-btn" id="filter-toggle" aria-label="Filtrar por categoria" aria-expanded="false" aria-controls="filtro-painel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18l-7 8.5V20l-4-2v-5.5L3 4Z"/></svg>
        </button>
      </div>
    </div>

    <!-- Filtro por categoria (botão do funil, no celular) -->
    <div class="filter-panel" id="filtro-painel" hidden></div>

    <!-- ============ GRID ============ -->
    <section class="grid grid--shop" id="grid-produtos" style="margin-bottom:180px"></section>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="js/main.js"></script>
</body>
</html>
