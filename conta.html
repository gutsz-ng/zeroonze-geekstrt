<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu perfil — ZeroOnze</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-conta">

  <!-- ============ HEADER ============ -->
  <header class="header">
    <div class="container header__inner">
      <nav class="nav" aria-label="Principal">
        <a href="index.html">Início</a>
        <a href="produtos.html">Produtos</a>
        <div class="dropdown">
          <a href="produtos.html">Categorias</a>
          <div class="dropdown__menu">
            <a href="produtos.html?categoria=dragon-ball">Dragon Ball</a>
            <a href="produtos.html?categoria=one-piece">One Piece</a>
            <a href="produtos.html?categoria=naruto">Naruto</a>
            <a href="produtos.html?categoria=jujutsu-kaisen">Jujutsu Kaisen</a>
            <a href="produtos.html?categoria=attack-on-titan">Attack on Titan</a>
          </div>
        </div>
        <a href="pedidos.html">Meus pedidos</a>
      </nav>

      <a class="logo" href="index.html"><img src="assets/img/logo.png" alt="ZeroOnze"></a>

      <div class="header__icons">
        <button class="icon-btn" id="search-toggle" data-icon="busca" aria-label="Buscar"></button>
        <a class="icon-btn account-link" href="entrar.html" data-icon="conta" data-account aria-label="Minha conta" title="Minha conta"><span class="account-hello"></span></a>
        <button class="icon-btn" id="cart-open" data-icon="carrinho" aria-label="Carrinho">
          <span class="cart-count"></span>
        </button>
      </div>
    </div>

    <!-- Busca suspensa -->
    <div class="search-pop" id="search-pop">
      <div class="container">
        <form class="search" action="produtos.html" method="get" role="search">
          <input type="search" name="busca" placeholder="Buscar produtos, ex.: Dragon Ball" aria-label="Buscar produtos">
          <button type="submit" data-icon="lupa" aria-label="Buscar"></button>
        </form>
      </div>
    </div>
  </header>

  <main class="profile" data-conta>
    <div class="profile__inner">
      <nav class="profile-menu" aria-label="Meu perfil">
        <p class="profile-menu__title display">Meu Perfil</p>
        <button class="profile-menu__item" data-aba="pedidos">Meus Pedidos</button>
        <button class="profile-menu__item" data-aba="info">Minhas Informações</button>
        <button class="profile-menu__item" data-aba="pagamentos">Métodos de Pagamento</button>
        <button class="profile-menu__item" data-aba="salvos">Produtos Salvos</button>
        <button class="profile-menu__item profile-menu__item--sair" id="conta-sair">Sair da conta</button>
      </nav>
      <section class="profile-panel" id="conta-painel" aria-live="polite"></section>
    </div>
  </main>
  <footer class="footer" id="footer"></footer>

  <script src="js/main.js"></script>
</body>
</html>
